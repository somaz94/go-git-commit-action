name: Continuous Integration

on:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/**'
      - '**/*.md'
      - 'test/**'
      - 'backup/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ci-prelude:
    name: Unit Tests + Docker Build + Container Smoke
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:2
        ports:
          - 5001:5000
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 10
          token: ${{ secrets.PAT_TOKEN }}

      - name: Go unit tests + Docker build and push to local registry
        id: ci
        uses: somaz94/go-docker-action-ci-action@v1
        with:
          manage_registry: 'false'
          test_command: 'go test ./internal/... -v -cover -coverprofile=coverage.out'

      - name: Create Test File
        run: |
          echo "$(date +%s)-$RANDOM" > test/test1.txt

      - name: Run the Container
        env:
          USER_EMAIL: actions@github.com
          USER_NAME: GitHub Actions
          COMMIT_MESSAGE: test1 ${{ github.run_id }}!
          BRANCH: test
          REPOSITORY_PATH: test
          FILE_PATTERN: .
          TAG_NAME: test1-${{ github.run_id }}
          TAG_MESSAGE: test1 ${{ github.run_id }}
          TAG_REFERENCE: v1.0.1
        run: |
          docker run \
          --env INPUT_USER_EMAIL="${{ env.USER_EMAIL }}" \
          --env INPUT_USER_NAME="${{ env.USER_NAME }}" \
          --env INPUT_COMMIT_MESSAGE="${{ env.COMMIT_MESSAGE }}" \
          --env INPUT_BRANCH="${{ env.BRANCH }}" \
          --env INPUT_REPOSITORY_PATH="${{ env.REPOSITORY_PATH }}" \
          --env INPUT_FILE_PATTERN="${{ env.FILE_PATTERN }}" \
          --env INPUT_TAG_NAME="${{ env.TAG_NAME }}" \
          --env INPUT_TAG_MESSAGE="${{ env.TAG_MESSAGE }}" \
          --env INPUT_TAG_REFERENCE="${{ env.TAG_REFERENCE }}" \
          --env GITHUB_TOKEN="${{ secrets.PAT_TOKEN }}" \
          --volume ${{ github.workspace }}:/app \
          --rm "${{ steps.ci.outputs.image_ref }}"

      - name: Confirm Tag Reference
        run: |
          git show -1 v1.0.1
          git show -1 test1-${{ github.run_id }}

      - name: Delete Tag
        env:
          USER_EMAIL: actions@github.com
          USER_NAME: GitHub Actions
          BRANCH: main
          TAG_NAME: test1-${{ github.run_id }}
          TAG_MESSAGE: test1 ${{ github.run_id }}
        run: |
          docker run \
          --env INPUT_USER_EMAIL="${{ env.USER_EMAIL }}" \
          --env INPUT_USER_NAME="${{ env.USER_NAME }}" \
          --env INPUT_BRANCH="${{ env.BRANCH }}" \
          --env INPUT_TAG_NAME="${{ env.TAG_NAME }}" \
          --env INPUT_DELETE_TAG="true" \
          --env GITHUB_TOKEN="${{ secrets.PAT_TOKEN }}" \
          --volume ${{ github.workspace }}:/app \
          --rm "${{ steps.ci.outputs.image_ref }}"

  test-action-auto-branch-false:
    name: Test Auto Branch False
    runs-on: ubuntu-latest
    needs: ci-prelude

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 10

      - name: Stage the action from this commit
        # ./ runs the pinned image and follows the action's branch switch.
        run: |
          set -euo pipefail
          mkdir .action
          git archive HEAD | tar -x -C .action
          sed -i -E "s|^(\s*image:\s*)docker://.*|\1'Dockerfile'|" .action/action.yml
          grep -qE "^\s*image: 'Dockerfile'$" .action/action.yml
          echo '/.action/' >> .git/info/exclude

      - name: Test Auto Branch Local Action (auto_branch false)
        uses: ./.action
        with:
          user_email: actions@github.com
          user_name: GitHub Actions
          branch: test
          create_pr: true
          auto_branch: false
          pr_title: test-pr-title
          pr_base: main
          pr_branch: test
          pr_labels: "test,automated,auto-branch-false-test"
          repository_path: test
          file_pattern: .
          github_token: ${{ secrets.PAT_TOKEN }}
          pr_closed: true

  test-action-auto-branch-true:
    name: Test Auto Branch True
    runs-on: ubuntu-latest
    needs: [ci-prelude, test-action-auto-branch-false]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 10
          token: ${{ secrets.PAT_TOKEN }}

      - name: Stage the action from this commit
        # ./ runs the pinned image and follows the action's branch switch.
        run: |
          set -euo pipefail
          mkdir .action
          git archive HEAD | tar -x -C .action
          sed -i -E "s|^(\s*image:\s*)docker://.*|\1'Dockerfile'|" .action/action.yml
          grep -qE "^\s*image: 'Dockerfile'$" .action/action.yml
          echo '/.action/' >> .git/info/exclude

      - name: Create Test File
        run: |
          echo "$(date +%s)-$RANDOM" > test/test2.txt

      - name: Test Auto Branch Local Action (auto_branch true)
        uses: ./.action
        with:
          user_email: actions@github.com
          user_name: GitHub Actions
          branch: test
          create_pr: true
          auto_branch: true
          pr_base: main
          pr_labels: "test,automated,auto-branch-true-test"
          repository_path: test
          file_pattern: .
          delete_source_branch: true
          github_token: ${{ secrets.PAT_TOKEN }}
          pr_closed: true

  test-skip-if-empty:
    name: Test Skip If Empty
    runs-on: ubuntu-latest
    needs: [test-action-auto-branch-true]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 10
          token: ${{ secrets.PAT_TOKEN }}

      - name: Stage the action from this commit
        # ./ runs the pinned image and follows the action's branch switch.
        run: |
          set -euo pipefail
          mkdir .action
          git archive HEAD | tar -x -C .action
          sed -i -E "s|^(\s*image:\s*)docker://.*|\1'Dockerfile'|" .action/action.yml
          grep -qE "^\s*image: 'Dockerfile'$" .action/action.yml
          echo '/.action/' >> .git/info/exclude

      - name: Test Skip If Empty (should skip - no changes)
        id: skip-test
        uses: ./.action
        with:
          user_email: actions@github.com
          user_name: GitHub Actions
          branch: test
          create_pr: true
          auto_branch: false
          pr_base: main
          pr_branch: test
          repository_path: test
          file_pattern: .
          skip_if_empty: true
          pr_title: "Test Skip If Empty - No Changes (should skip)"
          pr_labels: "test,automated,skip-if-empty-test"
          github_token: ${{ secrets.PAT_TOKEN }}
          pr_closed: true

      - name: Verify Skip Output
        run: |
          echo "skipped=${{ steps.skip-test.outputs.skipped }}"
          echo "changed_files=${{ steps.skip-test.outputs.changed_files }}"
          if [ "${{ steps.skip-test.outputs.skipped }}" != "true" ]; then
            echo "FAIL: expected skipped=true"
            exit 1
          fi
          echo "PASS: skip output verified"

      - name: Create Test File
        run: |
          echo "$(date +%s)-$RANDOM" > test/skip-test.txt

      - name: Test Skip If Empty (should not skip - with changes)
        id: no-skip-test
        uses: ./.action
        with:
          user_email: actions@github.com
          user_name: GitHub Actions
          branch: test
          create_pr: true
          auto_branch: true
          pr_base: main
          pr_labels: "test,automated,skip-if-empty-test"
          repository_path: test
          delete_source_branch: true
          file_pattern: .
          skip_if_empty: true
          pr_title: "Test Skip If Empty - With Changes (should not skip)"
          github_token: ${{ secrets.PAT_TOKEN }}
          pr_closed: true

      - name: Verify No-Skip Output
        run: |
          echo "skipped=${{ steps.no-skip-test.outputs.skipped }}"
          echo "changed_files=${{ steps.no-skip-test.outputs.changed_files }}"
          echo "pr_number=${{ steps.no-skip-test.outputs.pr_number }}"
          echo "pr_url=${{ steps.no-skip-test.outputs.pr_url }}"
          if [ "${{ steps.no-skip-test.outputs.skipped }}" != "false" ]; then
            echo "FAIL: expected skipped=false"
            exit 1
          fi
          echo "PASS: no-skip output verified"

  test-pr-auto-close-pr-body:
    name: Test PR Auto Close
    runs-on: ubuntu-latest
    needs: [test-skip-if-empty]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 10
          token: ${{ secrets.PAT_TOKEN }}

      - name: Stage the action from this commit
        # ./ runs the pinned image and follows the action's branch switch.
        run: |
          set -euo pipefail
          mkdir .action
          git archive HEAD | tar -x -C .action
          sed -i -E "s|^(\s*image:\s*)docker://.*|\1'Dockerfile'|" .action/action.yml
          grep -qE "^\s*image: 'Dockerfile'$" .action/action.yml
          echo '/.action/' >> .git/info/exclude

      - name: Configure Git Safe Directory
        run: git config --global --add safe.directory ${{ github.workspace }}

      - name: Test PR Auto Close
        uses: ./.action
        with:
          user_email: actions@github.com
          user_name: GitHub Actions
          branch: test
          pr_branch: test
          create_pr: true
          pr_base: main
          repository_path: test
          file_pattern: .
          pr_closed: true
          pr_labels: "test,automated,auto-close-pr-body-test"
          pr_title: "Test Auto Close PR"
          pr_body: |
            ## Test Auto Close PR
            This PR will be automatically closed after creation.
          github_token: ${{ secrets.PAT_TOKEN }}

  test-pr-dry-run:
    name: Test PR Dry Run
    runs-on: ubuntu-latest
    needs: [test-pr-auto-close-pr-body]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 10
          token: ${{ secrets.PAT_TOKEN }}

      - name: Stage the action from this commit
        # ./ runs the pinned image and follows the action's branch switch.
        run: |
          set -euo pipefail
          mkdir .action
          git archive HEAD | tar -x -C .action
          sed -i -E "s|^(\s*image:\s*)docker://.*|\1'Dockerfile'|" .action/action.yml
          grep -qE "^\s*image: 'Dockerfile'$" .action/action.yml
          echo '/.action/' >> .git/info/exclude

      - name: Test PR Dry Run (auto_branch false)
        uses: ./.action
        with:
          user_email: actions@github.com
          user_name: GitHub Actions
          branch: main
          create_pr: true
          auto_branch: false
          pr_title: "Test PR Dry Run"
          pr_base: test
          pr_branch: main
          pr_labels: "test,automated,dry-run-test"
          repository_path: "test"
          file_pattern: "pr-dry-run-test.txt"
          github_token: ${{ secrets.PAT_TOKEN }}
          pr_dry_run: true

      - name: Test PR Dry Run with Draft
        uses: ./.action
        with:
          user_email: actions@github.com
          user_name: GitHub Actions
          branch: main
          create_pr: true
          auto_branch: false
          pr_title: "Test PR Dry Run (Draft)"
          pr_base: test
          pr_branch: main
          pr_labels: "test,automated,draft-pr-test"
          repository_path: "test"
          file_pattern: "pr-dry-run-test.txt"
          github_token: ${{ secrets.PAT_TOKEN }}
          pr_draft: true
          pr_dry_run: true

      - name: Test PR Dry Run with Reviewers and Assignees
        uses: ./.action
        with:
          user_email: actions@github.com
          user_name: GitHub Actions
          branch: main
          create_pr: true
          auto_branch: false
          pr_title: "Test PR Dry Run (Reviewers/Assignees)"
          pr_base: test
          pr_branch: main
          pr_labels: "test,automated,reviewers-test"
          pr_reviewers: "somaz94"
          pr_assignees: "somaz94"
          repository_path: "test"
          file_pattern: "pr-dry-run-test.txt"
          github_token: ${{ secrets.PAT_TOKEN }}
          pr_dry_run: true

      - name: Create Test File
        run: |
          echo "$(date +%s)-$RANDOM" > test/dry-run-auto.txt

      - name: Test PR Dry Run (auto_branch true)
        id: dry-run-auto
        uses: ./.action
        with:
          user_email: actions@github.com
          user_name: GitHub Actions
          branch: main
          create_pr: true
          auto_branch: true
          pr_base: main
          repository_path: test
          file_pattern: .
          github_token: ${{ secrets.PAT_TOKEN }}
          pr_dry_run: true

      - name: Verify Dry Run Pushed No Branch
        env:
          PR_URL: ${{ steps.dry-run-auto.outputs.pr_url }}
        run: |
          set -euo pipefail
          branch=${PR_URL##*...}
          branch=${branch%%\?*}
          case "$branch" in
            update-files-*) ;;
            *) echo "FAIL: no generated branch in pr_url=$PR_URL"; exit 1 ;;
          esac
          rc=0
          git ls-remote --exit-code origin "refs/heads/$branch" || rc=$?
          case "$rc" in
            2) echo "PASS: dry run pushed no branch" ;;
            0) echo "FAIL: dry run left $branch on the remote"; exit 1 ;;
            *) echo "FAIL: ls-remote exit $rc"; exit 1 ;;
          esac

  ci-result:
    name: CI Result
    if: always()
    needs:
      - ci-prelude
      - test-action-auto-branch-false
      - test-action-auto-branch-true
      - test-skip-if-empty
      - test-pr-auto-close-pr-body
      - test-pr-dry-run
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || \
             [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "[FAIL]Some jobs failed or were cancelled"
            exit 1
          fi
          echo "[PASS]All CI jobs passed"