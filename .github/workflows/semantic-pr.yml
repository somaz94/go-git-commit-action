name: Semantic PR

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  semantic-pr:
    uses: somaz94/.github/.github/workflows/semantic-pr-reusable.yml@main
    # The CI self-test PRs come from these branches and carry non-conventional
    # titles on purpose; PRs from any other head branch are still validated.
    with:
      skip-head-ref-prefixes: |
        test
        update-files-
