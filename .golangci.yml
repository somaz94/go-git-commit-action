version: "2"

run:
  timeout: 5m
  allow-parallel-runners: true

# Defect-finding linters only: style checks (goconst, dupl, lll, gocyclo,
# prealloc) flag hundreds of non-bugs, and a lint that is never green gets ignored.
linters:
  default: none
  enable:
    - copyloopvar
    - errcheck
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unconvert
    - unused
  exclusions:
    generated: lax
    rules:
      # Fixtures set up with os.WriteFile and friends discard errors by design;
      # a failure there fails the test on the next line anyway.
      - path: _test\.go
        linters:
          - errcheck
      # QF checks are editor quickfix hints (e.g. "use Fprintf instead of
      # WriteString(Sprintf)"), not defects.
      - linters:
          - staticcheck
        text: "QF[0-9]+"
  settings:
    errcheck:
      # Meant for stdout reports, but it matches by name: fmt.Fprint* to a file
      # is silenced too, so check those errors by hand.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln

formatters:
  enable:
    - gofmt
    - goimports
